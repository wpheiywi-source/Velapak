<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เวลาพักคาเฟ่ - สะสมแต้ม</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Kanit', sans-serif; margin: 0; padding: 0; }
        body { 
            background: #1a1512; 
            color: #f8fafc; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            padding: 20px; 
        }
        .card { 
            background: #2b221c; 
            width: 100%; 
            max-width: 400px; 
            border-radius: 24px; 
            padding: 24px; 
            border: 1px solid #42342b; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.5); 
            text-align: center; 
        }
        .logo-container {
            width: 110px;
            height: 110px;
            margin: 0 auto 12px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #f59e0b;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            background: #181310;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-img { width: 100%; height: 100%; object-fit: cover; }
        .logo { font-size: 22px; font-weight: 700; color: #f59e0b; margin-bottom: 2px; }
        .subtitle { font-size: 13px; color: #a1a1aa; margin-bottom: 20px; }
        
        .profile-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: #181310;
            padding: 10px 16px;
            border-radius: 14px;
            margin-bottom: 16px;
            border: 1px solid #3d3027;
        }
        .profile-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid #f59e0b; }
        .profile-info { text-align: left; }
        .profile-name { font-size: 15px; font-weight: 600; color: #fef3c7; }
        .profile-phone { font-size: 12px; color: #a1a1aa; }

        .box-section {
            background: #181310;
            padding: 16px;
            border-radius: 14px;
            border: 1px solid #3d3027;
            margin-bottom: 16px;
            text-align: left;
        }
        .box-section input {
            width: 100%;
            padding: 10px;
            background: #2b221c;
            border: 1px solid #554235;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            text-align: center;
            margin-bottom: 10px;
            outline: none;
        }
        .box-section button {
            width: 100%;
            padding: 10px;
            background: #f59e0b;
            color: #1a0f00;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-secondary {
            background: #475569 !important;
            color: #fff !important;
            margin-top: 8px;
        }

        .stamp-grid { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            gap: 8px; 
            margin: 16px 0; 
        }
        .stamp-slot { 
            width: 100%; 
            aspect-ratio: 1; 
            border: 2px dashed #4a3c33; 
            border-radius: 12px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: 600; 
            font-size: 14px; 
            color: #71717a; 
            background: #181310; 
        }
        .stamp-slot.active { 
            border: 2px solid #f59e0b; 
            background: #3d2f24; 
            color: #f59e0b;
        }
        
        .voucher-card { 
            background: linear-gradient(135deg, #fef08a, #fde047, #eab308); 
            border-radius: 12px; 
            padding: 12px; 
            color: #451a03; 
            font-weight: 700; 
            margin-top: 12px; 
            display: none;
            box-shadow: 0 4px 12px rgba(234, 179, 8, 0.3);
        }
        .pts-footer { margin-top: 14px; font-size: 13px; color: #a1a1aa; }
        .pts-highlight { font-size: 20px; font-weight: 700; color: #f59e0b; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div class="card">
    <div class="logo-container">
        <img src="IMG_1839.PNG" alt="เวลาพักคาเฟ่" class="logo-img">
    </div>
    <div class="logo">เวลาพักคาเฟ่</div>
    <div class="subtitle">สะสมครบ 10 แต้ม รับฟรี 1 แก้ว!</div>

    <!-- หน้าที่ 1: ค้นหาเบอร์โทร -->
    <div id="pageSearch" class="box-section">
        <div style="font-size: 13px; color: #fcd34d; margin-bottom: 8px;">🔍 เช็คแต้มสะสมด้วยเบอร์โทรศัพท์</div>
        <input type="tel" id="searchPhoneInput" placeholder="กรอกเบอร์โทร 10 หลัก" maxlength="10">
        <button onclick="searchPhone()">ค้นหาแต้ม</button>
    </div>

    <!-- หน้าที่ 2: แสดงผลแต้ม (ซ่อนไว้ก่อนตอนแรก) -->
    <div id="pageResult" style="display: none;">
        <div class="profile-box">
            <div class="profile-info" style="text-align: center; width: 100%;">
                <div class="profile-name" id="displayName">-</div>
                <div class="profile-phone" id="displayPhone">-</div>
            </div>
        </div>

        <div class="stamp-grid" id="stampGrid"></div>

        <div class="voucher-card" id="voucherCard">
            🎁 คุณมีคูปองเครื่องดื่มฟรี <span id="voucherCount">0</span> ใบ! แจ้งพนักงานเพื่อใช้สิทธิ์
        </div>

        <div class="pts-footer">
            แต้มสะสมปัจจุบัน <span class="pts-highlight" id="pointCount">0</span> / 10 แต้ม
        </div>
        <button class="btn-secondary" onclick="goBackToSearch()">🔍 ค้นหาเบอร์อื่น / กลับหน้าแรก</button>
    </div>

    <!-- หน้าที่ 2.2: สำหรับลูกค้าใหม่ (ให้กรอกชื่อ) -->
    <div id="pageRegister" class="box-section" style="display: none;">
        <div style="font-size: 13px; color: #fcd34d; margin-bottom: 8px;">✨ ไม่พบเบอร์นี้ในระบบ (สมัครสมาชิกใหม่)</div>
        <input type="text" id="inputCustomerName" placeholder="กรอกชื่อ - นามสกุลของคุณ">
        <button onclick="registerNewCustomer()">บันทึกข้อมูลสมาชิก</button>
        <button class="btn-secondary" onclick="goBackToSearch()">ย้อนกลับ</button>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://iphone4546-default-rtdb.asia-southeast1.firebasedatabase.app/" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    
    let currentPhone = '';

    function searchPhone() {
        const phone = document.getElementById('searchPhoneInput').value.trim();
        if (phone.length < 10) {
            alert('กรุณากรอกเบอร์โทรศัพท์ให้ครบ 10 หลักครับ');
            return;
        }
        currentPhone = phone;

        database.ref('loyalty/' + phone).once('value', (snapshot) => {
            if (snapshot.exists()) {
                // เจอข้อมูล -> ไปหน้าแสดงแต้ม
                const data = snapshot.val();
                document.getElementById('displayName').innerText = data.name || 'ลูกค้าเวลาพัก';
                document.getElementById('displayPhone').innerText = 'เบอร์: ' + phone;
                renderStamps(data.points || 0, data.vouchers || 0);
                
                document.getElementById('pageSearch').style.display = 'none';
                document.getElementById('pageResult').style.display = 'block';
                document.getElementById('pageRegister').style.display = 'none';
            } else {
                // ไม่เจอข้อมูล -> เปิดหน้าให้กรอกชื่อสมัครใหม่
                document.getElementById('pageSearch').style.display = 'none';
                document.getElementById('pageResult').style.display = 'none';
                document.getElementById('pageRegister').style.display = 'block';
            }
        });
    }

    function registerNewCustomer() {
        const name = document.getElementById('inputCustomerName').value.trim();
        if (!name) {
            alert('กรุณากรอกชื่อ-นามสกุลก่อนบันทึกครับ');
            return;
        }

        const newData = {
            name: name,
            phone: currentPhone,
            points: 0,
            vouchers: 0,
            updatedAt: Date.now()
        };

        database.ref('loyalty/' + currentPhone).set(newData, (error) => {
            if (!error) {
                alert('บันทึกข้อมูลสำเร็จ! ระบบส่งข้อมูลไปที่หลังบ้านเรียบร้อย');
                // พาไปหน้าแสดงแต้มต่อเลย
                document.getElementById('displayName').innerText = name;
                document.getElementById('displayPhone').innerText = 'เบอร์: ' + currentPhone;
                renderStamps(0, 0);

                document.getElementById('pageRegister').style.display = 'none';
                document.getElementById('pageResult').style.display = 'block';
            } else {
                alert('เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง');
            }
        });
    }

    function renderStamps(points, vouchers) {
        const grid = document.getElementById('stampGrid');
        grid.innerHTML = '';
        for (let i = 1; i <= 10; i++) {
            const slot = document.createElement('div');
            slot.className = `stamp-slot ${i <= points ? 'active' : ''}`;
            slot.innerText = i <= points ? '✓' : i;
            grid.appendChild(slot);
        }
        const voucherCard = document.getElementById('voucherCard');
        if (vouchers > 0) {
            voucherCard.style.display = 'block';
            document.getElementById('voucherCount').innerText = vouchers;
        } else {
            voucherCard.style.display = 'none';
        }
        document.getElementById('pointCount').innerText = points;
    }

    function goBackToSearch() {
        document.getElementById('searchPhoneInput').value = '';
        document.getElementById('inputCustomerName').value = '';
        document.getElementById('pageSearch').style.display = 'block';
        document.getElementById('pageResult').style.display = 'none';
        document.getElementById('pageRegister').style.display = 'none';
    }
</script>
</body>
</html>
