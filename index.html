<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เวลาพัก คาเฟ่ - สะสมแต้ม</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Kanit', sans-serif; margin: 0; padding: 0; }
        body { 
            background-image: url('HMUA5549.PNG');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #fff; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(30, 30, 30, 0.92);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 420px;
            padding: 25px;
            border-radius: 24px;
            border: 1px solid #444;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }
        .brand-badge {
            background: #fef3c7;
            color: #b45309;
            font-weight: 600;
            font-size: 15px;
            padding: 10px 16px;
            border-radius: 30px;
            display: inline-block;
            margin-bottom: 20px;
            border: 1px solid #fcd34d;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 { color: #f59e0b; margin-bottom: 8px; font-size: 22px; }
        p.sub-text { font-size: 14px; color: #aaa; margin-bottom: 20px; }
        
        .input-group { margin-bottom: 16px; text-align: left; }
        label { display: block; font-size: 13px; color: #ccc; margin-bottom: 6px; }
        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid #555;
            background: #222;
            color: #fff;
            font-size: 16px;
            outline: none;
            text-align: center;
        }
        input:focus { border-color: #f59e0b; }
        
        .btn {
            width: 100%;
            background: #f59e0b;
            color: #000;
            font-weight: 700;
            border: none;
            padding: 14px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn:hover { background: #d97706; }

        .result-card {
            background: #262626;
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
            border: 1px solid #444;
            display: none;
        }
        .pts-number { font-size: 38px; font-weight: 700; color: #f59e0b; margin: 5px 0; }
        .voucher-box { background: #332d1d; border: 1px dashed #f59e0b; padding: 10px; border-radius: 10px; margin-top: 12px; color: #fef3c7; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <div class="brand-badge">ขอให้มีความสุขกับการทานนะค่ะ 😊</div>
    <h2>☕ เวลาพัก คาเฟ่</h2>
    <p class="sub-text">เช็คแต้มสะสมและสิทธิพิเศษของคุณ</p>

    <div class="input-group">
        <label>เบอร์โทรศัพท์มือถือ (10 หลัก)</label>
        <input type="tel" id="phoneInput" placeholder="0812345678" maxlength="10">
    </div>

    <button class="btn" onclick="checkPoints()">ตรวจสอบแต้ม</button>

    <div class="result-card" id="resultCard">
        <div id="displayName" style="font-size: 18px; font-weight: 600; color: #fff; margin-bottom: 5px;"></div>
        <div style="font-size: 13px; color: #888;" id="displayPhone"></div>
        
        <div style="font-size: 13px; color: #aaa; margin-top: 15px;">คะแนนสะสมของคุณ</div>
        <div class="pts-number"><span id="pointsVal">0</span> <span style="font-size: 18px; color: #fff;">แต้ม</span></div>
        <div style="font-size: 12px; color: #aaa;">(สะสมครบ 10 แต้ม รับคูปองฟรี 1 ใบ)</div>

        <div class="voucher-box">
            🎁 คูปองส่วนลด/ฟรีคงเหลือ: <strong id="vouchersVal" style="font-size: 18px; color: #f59e0b;">0</strong> ใบ
        </div>
    </div>
</div>

<script>
    // เชื่อมต่อ Firebase ฐานข้อมูลเดียวกันกับหลังร้าน
    const firebaseConfig = { databaseURL: "https://iphone4546-default-rtdb.asia-southeast1.firebasedatabase.app/" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    function checkPoints() {
        const phone = document.getElementById('phoneInput').value.trim();
        if (phone.length !== 10 || !/^\d+$/.test(phone)) {
            alert('กรุณากรอกเบอร์โทรศัพท์ให้ถูกต้อง 10 หลักครับ');
            return;
        }

        database.ref('loyalty/' + phone).once('value').then((snapshot) => {
            const resultCard = document.getElementById('resultCard');
            resultCard.style.display = 'block';

            if (snapshot.exists()) {
                const data = snapshot.val();
                document.getElementById('displayName').innerText = data.name ? `คุณ ${data.name}` : 'คุณลูกค้า (ยังไม่ระบุชื่อ)';
                document.getElementById('displayPhone').innerText = `เบอร์: ${phone}`;
                document.getElementById('pointsVal').innerText = data.points || 0;
                document.getElementById('vouchersVal').innerText = data.vouchers || 0;
            } else {
                document.getElementById('displayName').innerText = 'ยังไม่พบข้อมูลสะสมแต้ม';
                document.getElementById('displayPhone').innerText = `เบอร์: ${phone}`;
                document.getElementById('pointsVal').innerText = '0';
                document.getElementById('vouchersVal').innerText = '0';

                // ถ้ายังไม่มีเบอร์นี้ในระบบ ให้บันทึกลง recent_checkins เพื่อให้หลังร้านเห็นทันที
                database.ref('recent_checkins').push({
                    phone: phone,
                    name: 'ลูกค้ารอใส่ชื่อ',
                    timestamp: Date.now()
                });
            }
        });
    }
</script>

</body>
</html>
