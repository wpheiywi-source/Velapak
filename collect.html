<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velapak Cafe - สะสมแต้ม</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Kanit', sans-serif; margin: 0; padding: 0; }
        body { 
            background: #1a1512;
            color: #f8fafc; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            padding: 24px 16px; 
        }
        .card { 
            background: #2b221c; 
            width: 100%; 
            max-width: 420px; 
            border-radius: 24px; 
            padding: 28px 22px; 
            border: 1px solid #42342b; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.5); 
            text-align: center; 
        }
        .brand-badge {
            display: inline-block;
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 16px;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        .header-title-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 6px;
        }
        .inline-logo {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #f59e0b;
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.3);
            background: #fff;
        }
        .logo { 
            font-size: 26px; 
            font-weight: 700; 
            color: #f59e0b;
            line-height: 1.2;
        }
        .subtitle { font-size: 14px; color: #a1a1aa; margin-bottom: 24px; }
        .phone-input-box { 
            display: flex; 
            gap: 8px; 
            background: #181310;
            padding: 6px;
            border-radius: 14px;
            border: 1px solid #3d3027;
            margin-bottom: 12px;
        }
        .phone-input-box input { 
            flex: 1; 
            padding: 10px; 
            border: none;
            background: transparent; 
            color: #fff; 
            font-size: 16px; 
            outline: none; 
            text-align: center; 
        }
        .phone-input-box button { 
            background: #f59e0b; 
            color: #1a0f00; 
            border: none; 
            padding: 0 18px; 
            border-radius: 10px; 
            font-weight: 700; 
            font-size: 14px;
            cursor: pointer; 
        }
        .name-edit-box {
            background: #221a14;
            border: 1px solid #42342b;
            border-radius: 14px;
            padding: 10px;
            margin-bottom: 20px;
            display: flex;
            gap: 8px;
        }
        .name-edit-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fcd34d;
            font-size: 14px;
            text-align: center;
            outline: none;
        }
        .name-edit-box button {
            background: #10b981;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .customer-greeting { font-size: 18px; font-weight: 600; color: #fef3c7; margin-bottom: 2px; }
        .voucher-card { 
            background: linear-gradient(135deg, #fef08a, #fde047, #eab308); 
            border-radius: 14px; 
            padding: 14px 18px; 
            color: #451a03; 
            font-weight: 700; 
            margin: 16px 0 8px 0; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 8px 20px rgba(234, 179, 8, 0.3);
        }
        .voucher-notice {
            font-size: 13px;
            color: #fcd34d;
            background: rgba(245, 158, 11, 0.1);
            border: 1px dashed rgba(245, 158, 11, 0.3);
            border-radius: 10px;
            padding: 8px 12px;
            margin-bottom: 16px;
            line-height: 1.4;
        }
        .stamp-grid { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            gap: 10px; 
            margin: 20px 0; 
        }
        .stamp-slot { 
            width: 100%; 
            aspect-ratio: 1; 
            border: 2px dashed #4a3c33; 
            border-radius: 14px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: 600; 
            font-size: 14px; 
            color: #71717a; 
            background: #181310; 
            overflow: hidden;
            padding: 2px;
        }
        .stamp-slot.active { 
            border: 2px solid #f59e0b; 
            background: #3d2f24; 
        }
        .stamp-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }
        .pts-footer { margin-top: 15px; font-size: 14px; color: #a1a1aa; }
        .pts-highlight { font-size: 22px; font-weight: 700; color: #f59e0b; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div class="card">
    <div class="brand-badge">VELAPAK LOYALTY</div>
    
    <div class="header-title-container">
        <img id="headerLogo" src="" alt="โลโก้" class="inline-logo">
        <div class="logo">เวลาพักคาเฟ่</div>
    </div>
    
    <div class="subtitle">สะสมครบ 10 แต้ม รับฟรี 1 แก้ว!</div>

    <div class="phone-input-box">
        <input type="tel" id="userPhone" placeholder="กรอกเบอร์โทรศัพท์" maxlength="10">
        <button onclick="checkPoints()">ค้นหา</button>
    </div>

    <div id="pointDisplayArea" style="display: none;">
        <div class="customer-greeting" id="displayGreeting"></div>
        <div style="font-size: 13px; color: #71717a; margin-bottom: 8px;">เบอร์: <span id="displayPhone"></span></div>

        <div class="name-edit-box">
            <input type="text" id="custNameInput" placeholder="กรอกชื่อของคุณ (เช่น ก้อย)">
            <button onclick="saveCustomerName()">บันทึกชื่อ</button>
        </div>
        
        <div id="voucherSection" style="display: none;">
            <div class="voucher-card">
                <span>🎁 คูปองรับฟรี 1 แก้วสะสม</span>
                <span style="font-size: 20px;"><span id="voucherCount">0</span> ใบ</span>
            </div>
            <div class="voucher-notice">
                ✨ คุณมีสิทธิ์รับเครื่องดื่มฟรี <strong id="noticeVoucherCount">0</strong> ใบ<br>สามารถแจ้งพนักงานหน้าร้านเพื่อรับสิทธิ์ได้เลยครับ!
            </div>
        </div>

        <div class="stamp-grid" id="stampGrid"></div>
        
        <div class="pts-footer">
            แต้มสะสมปัจจุบัน <span class="pts-highlight" id="pointCount">0</span> / 10 แต้ม
        </div>
    </div>
</div>

<script>
    // ปรับปรุงเส้นทางรูปภาพให้รองรับทั้งชื่อไฟล์ logo.png และภาพตราปั๊ม
    const logoSources = [
        "logo.png",
        "https://raw.githubusercontent.com/tcutxhjugcy-dev/wela-phak-cafe/main/logo.png"
    ];

    function applyImageWithFallback(imgElement) {
        let index = 0;
        imgElement.src = logoSources[index];
        imgElement.onerror = function() {
            index++;
            if (index < logoSources.length) {
                this.src = logoSources[index];
            }
        };
    }

    applyImageWithFallback(document.getElementById('headerLogo'));

    const firebaseConfig = { databaseURL: "https://wela-phak-cafe-default-rtdb.asia-southeast1.firebasedatabase.app/" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let currentPhone = '';

    function checkPoints() {
        const phone = document.getElementById('userPhone').value.trim();
        if (phone.length < 9) { alert('กรุณากรอกเบอร์โทรศัพท์ให้ถูกต้อง'); return; }
        currentPhone = phone;

        database.ref('loyalty/' + phone).on('value', (snapshot) => {
            const data = snapshot.exists() ? snapshot.val() : {};
            renderStamps(phone, data.name || '', data.points || 0, data.vouchers || 0);
        });
    }

    function saveCustomerName() {
        const newName = document.getElementById('custNameInput').value.trim();
        if (!newName) { alert('กรุณากรอกชื่อก่อนกดบันทึก'); return; }
        if (!currentPhone) return;

        database.ref('loyalty/' + currentPhone).update({ name: newName });
        database.ref('recent_checkins/' + currentPhone).set({
            name: newName,
            phone: currentPhone,
            timestamp: Date.now()
        });

        alert('บันทึกชื่อเรียบร้อย! พนักงานได้รับข้อมูลแล้วครับ');
    }

    function renderStamps(phone, name, points, vouchers) {
        document.getElementById('pointDisplayArea').style.display = 'block';
        document.getElementById('displayGreeting').innerText = name ? `สวัสดีคุณ ${name}` : 'ยินดีต้อนรับครับ';
        document.getElementById('custNameInput').value = name;
        document.getElementById('displayPhone').innerText = phone;
        document.getElementById('pointCount').innerText = points;

        const voucherSection = document.getElementById('voucherSection');
        if (vouchers > 0) {
            voucherSection.style.display = 'block';
            document.getElementById('voucherCount').innerText = vouchers;
            document.getElementById('noticeVoucherCount').innerText = vouchers;
        } else {
            voucherSection.style.display = 'none';
        }

        const grid = document.getElementById('stampGrid');
        grid.innerHTML = '';

        for (let i = 1; i <= 10; i++) {
            const slot = document.createElement('div');
            slot.className = `stamp-slot ${i <= points ? 'active' : ''}`;
            
            if (i <= points) {
                const img = document.createElement('img');
                img.className = 'stamp-img';
                img.alt = 'แต้ม';
                applyImageWithFallback(img);
                slot.appendChild(img);
            } else {
                slot.innerText = i;
            }
            grid.appendChild(slot);
        }
    }
</script>
</body>
</html>
