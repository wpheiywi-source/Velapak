<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velapak Cafe - หลังร้าน (แอดมิน)</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Kanit', sans-serif; margin: 0; padding: 0; }
        body { 
            background-image: url('HMUA5549.PNG');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #4a3b32; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 24px 16px; 
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 28px 22px;
            border: 1px solid #e3d7cb;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            margin-top: 20px;
        }
        .admin-badge {
            display: inline-block; background: rgba(184, 134, 11, 0.1); color: #b8860b; padding: 4px 14px; border-radius: 20px; font-size: 12px; font-weight: 500; margin-bottom: 12px; border: 1px solid rgba(184, 134, 11, 0.3);
            text-align: center;
            width: 100%;
        }
        h2 { text-align: center; color: #4a3b32; margin-bottom: 20px; font-size: 22px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #4a3b32; }
        
        .phone-input-box { 
            display: flex; gap: 8px; background: #faf8f5; padding: 6px; border-radius: 14px; border: 1px solid #dcd2c5; margin-bottom: 12px;
        }
        .phone-input-box input { flex: 1; padding: 10px; border: none; background: transparent; color: #4a3b32; font-size: 16px; outline: none; text-align: center; }
        .phone-input-box input::placeholder { color: #b5a496; }
        .phone-input-box button { background: #b8860b; color: #fff; border: none; padding: 0 18px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; transition: background 0.2s; }
        .phone-input-box button:hover { background: #996f08; }

        .name-edit-box { background: #faf8f5; border: 1px solid #dcd2c5; border-radius: 14px; padding: 10px; margin-bottom: 15px; display: flex; gap: 8px; }
        .name-edit-box input { flex: 1; background: transparent; border: none; color: #b8860b; font-size: 14px; text-align: center; outline: none; font-weight: 600; }
        .name-edit-box button { background: #10b981; color: #fff; border: none; padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
        
        .result-box {
            margin-top: 15px; background: #faf8f5; border: 1px solid #dcd2c5; border-radius: 14px; padding: 16px; text-align: center;
        }
        .customer-info { font-size: 16px; color: #7c685c; margin-bottom: 4px; }
        .points-badge { font-size: 24px; font-weight: 700; color: #b8860b; margin: 12px 0; }
        
        .btn-group { display: flex; gap: 8px; margin-top: 15px; }
        .btn-group button { flex: 1; padding: 10px 4px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; font-size: 13px; }
        .btn-add { background: #10b981; color: white; }
        .btn-redeem { background: #f59e0b; color: white; }
        .btn-reset { background: #ef4444; color: white; }

        .voucher-notice-box {
            background: rgba(184, 134, 11, 0.08); border: 1px dashed rgba(184, 134, 11, 0.3); border-radius: 10px; padding: 8px; margin-bottom: 12px; font-size: 13px; color: #85581a;
        }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div class="container">
    <div class="admin-badge">VELAPAK CAFE - ระบบจัดการหลังร้าน</div>
    <h2>จัดการแต้มลูกค้า</h2>

    <div class="form-group">
        <label>เบอร์โทรศัพท์ลูกค้า</label>
        <div class="phone-input-box">
            <input type="tel" id="searchPhone" placeholder="กรอกเบอร์โทร 10 หลัก" maxlength="10">
            <button onclick="findCustomer()">ค้นหา</button>
        </div>
    </div>

    <div id="manageArea" style="display: none;">
        <div class="result-box">
            <div class="customer-info">เบอร์โทร: <span id="resPhone" style="font-weight: 600; color: #4a3b32;"></span></div>
            
            <!-- ช่องแก้ไขชื่อลูกค้า -->
            <div style="margin-top: 10px;">
                <label style="font-size: 12px; text-align: left; margin-bottom: 4px;">ชื่อลูกค้า:</label>
                <div class="name-edit-box">
                    <input type="text" id="resNameInput" placeholder="ระบุชื่อลูกค้า">
                    <button onclick="saveCustomerName()">บันทึกชื่อ</button>
                </div>
            </div>

            <div class="voucher-notice-box">
                🎁 คูปองฟรีสะสม: <strong id="resVoucher" style="color: #b8860b; font-size: 16px;">0</strong> ใบ
            </div>
            
            <div class="points-badge">แต้มปัจจุบัน: <span id="resPoints">0</span> / 10 แต้ม</div>

            <div class="btn-group">
                <button class="btn-add" onclick="modifyPoints(1)">+ เพิ่ม 1 แต้ม</button>
                <button class="btn-redeem" onclick="useVoucher()">🎁 ใช้สิทธิ์คูปอง</button>
                <button class="btn-reset" onclick="modifyPoints(-1)">- ลด 1 แต้ม</button>
            </div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://iphone4546-default-rtdb.asia-southeast1.firebasedatabase.app/" };
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const database = firebase.database();

    let activePhone = '';
    let currentData = { name: '', points: 0, vouchers: 0 };

    function findCustomer() {
        const phone = document.getElementById('searchPhone').value.trim();
        if (phone.length < 9) {
            alert('กรุณากรอกเบอร์โทรศัพท์ให้ถูกต้อง');
            return;
        }
        activePhone = phone;

        database.ref('loyalty/' + phone).once('value')
            .then((snapshot) => {
                if (snapshot.exists()) {
                    currentData = snapshot.val();
                } else {
                    currentData = { name: '', points: 0, vouchers: 0 };
                }
                updateUI();
                document.getElementById('manageArea').style.display = 'block';
            })
            .catch((error) => {
                console.error(error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูล');
            });
    }

    function updateUI() {
        document.getElementById('resPhone').innerText = activePhone;
        document.getElementById('resNameInput').value = currentData.name || '';
        document.getElementById('resPoints').innerText = currentData.points || 0;
        document.getElementById('resVoucher').innerText = currentData.vouchers || 0;
    }

    function saveCustomerName() {
        const newName = document.getElementById('resNameInput').value.trim();
        if (!activePhone) return;

        currentData.name = newName;
        database.ref('loyalty/' + activePhone).update({ name: newName })
            .then(() => {
                alert('บันทึกชื่อลูกค้าสำเร็จ!');
            });
    }

    function modifyPoints(amount) {
        if (!activePhone) return;

        let newPoints = (currentData.points || 0) + amount;
        let newVouchers = currentData.vouchers || 0;

        if (newPoints > 10) {
            newPoints = newPoints - 10;
            newVouchers += 1;
            alert('🎉 ลูกค้าสะสมครบ 10 แต้ม! ระบบเพิ่มคูปองฟรี 1 แก้วให้อัตโนมัติครับ');
        } else if (newPoints < 0) {
            newPoints = 0;
        }

        currentData.points = newPoints;
        currentData.vouchers = newVouchers;

        database.ref('loyalty/' + activePhone).update({
            points: newPoints,
            vouchers: newVouchers
        }).then(() => {
            updateUI();
            alert('อัปเดตแต้มสำเร็จ!');
        });
    }

    function useVoucher() {
        if (!activePhone) return;
        let vouchers = currentData.vouchers || 0;

        if (vouchers <= 0) {
            alert('ลูกค้านี้ยังไม่มีคูปองฟรีให้ใช้สิทธิ์ครับ');
            return;
        }

        if (confirm('ยืนยันการใช้สิทธิ์คูปองฟรี 1 แก้ว?')) {
            currentData.vouchers = vouchers - 1;
            database.ref('loyalty/' + activePhone).update({
                vouchers: currentData.vouchers
            }).then(() => {
                updateUI();
                alert('ใช้สิทธิ์คูปองสำเร็จเรียบร้อยครับ!');
            });
        }
    }
</script>
</body>
</html>
