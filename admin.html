<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velapak Cafe - หลังร้าน (แอดมิน)</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Kanit', sans-serif; margin: 0; padding: 0; }
        body { 
            /* เปลี่ยนภาพพื้นหลังหลังร้านเป็น HMUA5549.PNG */
            background-image: url('HMUA5549.PNG');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #4a3b32; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 24px 16px; 
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 28px 22px;
            border: 1px solid #e3d7cb;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            margin-top: 20px;
        }
        .admin-badge {
            display: inline-block; background: rgba(184, 134, 11, 0.1); color: #b8860b; padding: 4px 14px; border-radius: 20px; font-size: 12px; font-weight: 500; margin-bottom: 12px; border: 1px solid rgba(184, 134, 11, 0.3);
            text-align: center;
            width: 100%;
        }
        h2 { text-align: center; color: #4a3b32; margin-bottom: 20px; font-size: 22px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #4a3b32; }
        input, select {
            width: 100%; padding: 12px; border: 1px solid #dcd2c5; background: #faf8f5; border-radius: 12px; font-size: 16px; color: #4a3b32; outline: none; text-align: center;
        }
        button.action-btn {
            width: 100%; background: #b8860b; color: white; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: background 0.2s; margin-top: 10px;
        }
        button.action-btn:hover { background: #996f08; }
        
        .result-box {
            margin-top: 20px; background: #faf8f5; border: 1px solid #dcd2c5; border-radius: 14px; padding: 16px; text-align: center;
        }
        .customer-info { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
        .points-badge { font-size: 24px; font-weight: 700; color: #b8860b; margin: 10px 0; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn-group button { flex: 1; padding: 10px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; font-size: 14px; }
        .btn-add { background: #10b981; color: white; }
        .btn-redeem { background: #f59e0b; color: white; }
        .btn-reset { background: #ef4444; color: white; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div class="container">
    <div class="admin-badge">VELAPAK CAFE - ระบบจัดการหลังร้าน</div>
    <h2>จัดการแต้มลูกค้า</h2>

    <div class="form-group">
        <label>เบอร์โทรศัพท์ลูกค้า</label>
        <input type="tel" id="searchPhone" placeholder="กรอกเบอร์โทร 10 หลัก" maxlength="10">
    </div>
    <button class="action-btn" onclick="findCustomer()">ค้นหาข้อมูลลูกค้า</button>

    <div id="manageArea" class="result-box" style="display: none;">
        <div class="customer-info" id="resName">ชื่อ: -</div>
        <div style="font-size: 14px; color: #7c685c;">เบอร์โทร: <span id="resPhone"></span></div>
        <div style="font-size: 14px; color: #7c685c;">คูปองฟรี (แก้วสะสม): <strong id="resVoucher" style="color: #b8860b;">0</strong> ใบ</div>
        
        <div class="points-badge">แต้มปัจจุบัน: <span id="resPoints">0</span> / 10</div>

        <div class="btn-group">
            <button class="btn-add" onclick="modifyPoints(1)">+ เพิ่ม 1 แต้ม</button>
            <button class="btn-redeem" onclick="useVoucher()">🎁 ใช้สิทธิ์คูปอง</button>
            <button class="btn-reset" onclick="modifyPoints(-1)">- ลด 1 แต้ม</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://iphone4546-default-rtdb.asia-southeast1.firebasedatabase.app/" };
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const database = firebase.database();

    let activePhone = '';
    let currentData = { name: '', points: 0, vouchers: 0 };

    function findCustomer() {
        const phone = document.getElementById('searchPhone').value.trim();
        if (phone.length < 9) {
            alert('กรุณากรอกเบอร์โทรศัพท์ให้ถูกต้อง');
            return;
        }
        activePhone = phone;

        database.ref('loyalty/' + phone).once('value')
            .then((snapshot) => {
                if (snapshot.exists()) {
                    currentData = snapshot.val();
                } else {
                    currentData = { name: 'ลูกค้าใหม่', points: 0, vouchers: 0 };
                }
                updateUI();
                document.getElementById('manageArea').style.display = 'block';
            })
            .catch((error) => {
                console.error(error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูล');
            });
    }

    function updateUI() {
        document.getElementById('resName').innerText = `ชื่อ: ${currentData.name || 'ยังไม่ระบุชื่อ'}`;
        document.getElementById('resPhone').innerText = activePhone;
        document.getElementById('resPoints').innerText = currentData.points || 0;
        document.getElementById('resVoucher').innerText = currentData.vouchers || 0;
    }

    function modifyPoints(amount) {
        if (!activePhone) return;

        let newPoints = (currentData.points || 0) + amount;
        let newVouchers = currentData.vouchers || 0;

        if (newPoints > 10) {
            newPoints = newPoints - 10;
            newVouchers += 1;
            alert('🎉 ลูกค้าสะสมครบ 10 แต้ม! ระบบเพิ่มคูปองฟรี 1 แก้วให้อัตโนมัติครับ');
        } else if (newPoints < 0) {
            newPoints = 0;
        }

        currentData.points = newPoints;
        currentData.vouchers = newVouchers;

        database.ref('loyalty/' + activePhone).update({
            points: newPoints,
            vouchers: newVouchers
        }).then(() => {
            updateUI();
            alert('บันทึกข้อมูลสำเร็จ!');
        });
    }

    function useVoucher() {
        if (!activePhone) return;
        let vouchers = currentData.vouchers || 0;

        if (vouchers <= 0) {
            alert('ลูกค้านี้ยังไม่มีคูปองฟรีให้ใช้สิทธิ์ครับ');
            return;
        }

        if (confirm('ยืนยันการใช้สิทธิ์คูปองฟรี 1 แก้ว?')) {
            currentData.vouchers = vouchers - 1;
            database.ref('loyalty/' + activePhone).update({
                vouchers: currentData.vouchers
            }).then(() => {
                updateUI();
                alert('ใช้สิทธิ์คูปองสำเร็จเรียบร้อยครับ!');
            });
        }
    }
</script>
</body>
</html>
